# Builds "Eden Duo Dev" (Mainline flavor, relWithDebInfo build type) on GitHub's machines.
# The Dev build has its own app ID (dev.igawa6.edenduo.dev), so it installs beside the
# official Eden Duo instead of replacing it. Start it from the Actions tab ("Run workflow"),
# or push to the vallhalla branch. The APK is attached to the finished run as an artifact.
name: Build Eden Duo Dev APK

on:
  workflow_dispatch:
  push:
    branches: [vallhalla]

concurrency:
  group: build-dev-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          df -h /

      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Host tools the CMake configure needs (shader compiler for video_core host shaders).
      - name: Install host build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q glslang-tools patch
          glslangValidator --version | head -1

      # GitHub's Ubuntu runners ship the Android SDK; use its own sdkmanager.
      - name: Install NDK, CMake and platform
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          ls -la "$SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;28.2.13676358" "cmake;3.31.6" "platforms;android-36"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Cache dependencies and Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .cache/cpm
          key: eden-duo-dev-${{ runner.os }}-${{ hashFiles('cpmfile.json', 'src/android/**/*.gradle.kts') }}
          restore-keys: eden-duo-dev-${{ runner.os }}-

      - name: Build
        working-directory: src/android
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ARGS="-Dorg.gradle.workers.max=$(nproc) -PYUZU_ANDROID_ARGS=-DUSE_CCACHE=false"
          # Pass 1: the CMake configure copies SDL's Java sources into externals/generated/sdl,
          # but Kotlin compilation can run before it and miss them on a clean checkout.
          # --continue lets the native build finish (and generate those sources) anyway.
          ./gradlew assembleMainlineRelWithDebInfo $ARGS --continue 2>&1 \
            | tee "$RUNNER_TEMP/build-pass1.log" || echo "Pass 1 failed; retrying with generated sources"
          ls ../../externals/generated/sdl/java 2>/dev/null | head || echo "no generated SDL java yet"
          # Pass 2: everything native is up to date; Kotlin now sees the SDL classes.
          ./gradlew assembleMainlineRelWithDebInfo $ARGS --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log"

      # On failure, surface the log as annotations (readable without downloading logs).
      - name: Report build errors
        if: failure()
        run: |
          LOG="$RUNNER_TEMP/build.log"
          [ -f "$LOG" ] || exit 0
          enc() { python3 -c 'import sys;d=sys.stdin.read()[-60000:];print(d.replace("%","%25").replace("\r","").replace("\n","%0A"))'; }
          grep -n -E "^e: |^w: .*(unresolved|Unresolved)|: error:|error: " "$LOG" | head -60 | enc | sed 's/^/::error title=Compiler errors::/'
          grep -n -i -E "error|failed|what went wrong|could not|cannot|not found|exception" "$LOG" | grep -v -E "^\S*:.*-Werror|Performing Test|Looking for|Could NOT find" | head -60 | enc | sed 's/^/::error title=Build error lines::/'
          tail -n 150 "$LOG" | enc | sed 's/^/::error title=Build log tail::/'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EdenDuo-Dev-${{ github.sha }}
          path: src/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      # A direct APK download on the fork's Releases page (easier on a handheld than the
      # zipped Actions artifact). Replaced by each new build.
      - name: Publish test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find src/android/app/build/outputs/apk -name '*.apk' | head -1)
          cp "$APK" EdenDuo-Dev.apk
          gh release delete vallhalla-dev --yes --cleanup-tag || true
          gh release create vallhalla-dev EdenDuo-Dev.apk --prerelease \
            --target "${{ github.sha }}" \
            --title "Eden Duo Dev - VAllhalla test build" \
            --notes "Test build of Eden Duo 1.2.1 with diagonal stick tokens for companions (LX-LY+ and friends). Installs as a separate app, Eden Duo Dev, beside the official Eden Duo. Built from commit ${{ github.sha }}."
